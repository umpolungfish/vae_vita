[package]
name = "vita_native"
version = "0.1.0"
edition = "2021"
license = "Unlicense"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Tensor arithmetic only — every design element (tokens, template, positions,
# attention, layers) is Grammar-derived; candle is the numeric substrate.
candle-core = "0.11"
candle-nn = "0.11"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[[bin]]
name = "vita-gen"
path = "src/gen.rs"

[[bin]]
name = "vita-train"
path = "src/train.rs"
